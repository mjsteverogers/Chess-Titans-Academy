<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Titans Academy - Student Portal</title>
    <link rel="icon" href="images/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="cta-loader.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- PDF-LIB for Client-Side PDF Watermarking -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'], },
                    colors: {
                        brand: { 50: '#fff7ed', 100: '#ffedd5', 200: '#fed7aa', 500: '#f97316', 600: '#ea580c', 700: '#c2410c', 800: '#9a3412', 900: '#7c2d12', },
                        secondary: { 900: '#1a1a1a', 800: '#262626', }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #fff7ed;
            background-image: linear-gradient(rgba(249, 115, 22, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(249, 115, 22, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            height: 100vh; height: 100dvh;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            border: 1px solid rgba(249, 115, 22, 0.1);
            box-shadow: 0 20px 25px -5px rgba(234, 88, 12, 0.1), 0 8px 10px -6px rgba(234, 88, 12, 0.1);
        }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .loader {
            border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #ea580c;
            width: 20px; height: 20px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Custom Animation for Dancing Robot */
        @keyframes dance {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-4px) rotate(-15deg); }
            50% { transform: translateY(0) rotate(0deg); }
            75% { transform: translateY(-4px) rotate(15deg); }
        }
        .animate-dance {
            animation: dance 1s ease-in-out infinite;
            transform-origin: bottom center;
        }

        /* Custom Animation for Learn Board Boy Climbing Steps & Taking Trophy */
        @keyframes lbBoyClimb {
            0% { transform: translate(16px, 48px); opacity: 0; }
            6% { transform: translate(16px, 48px); opacity: 1; }
            14% { transform: translate(28px, 38px); opacity: 1; }
            22% { transform: translate(40px, 41px); opacity: 1; }
            30% { transform: translate(52px, 31px); opacity: 1; }
            38% { transform: translate(64px, 34px); opacity: 1; }
            46% { transform: translate(76px, 24px); opacity: 1; }
            54% { transform: translate(89px, 27px); opacity: 1; }
            62% { transform: translate(92px, 27px); opacity: 1; }
            70% { transform: translate(92px, 27px); opacity: 1; }
            76% { transform: translate(92px, 24.5px); opacity: 1; }
            82% { transform: translate(92px, 27px); opacity: 1; }
            86% { transform: translate(92px, 25px); opacity: 1; }
            92% { transform: translate(92px, 27px); opacity: 1; }
            97%, 100% { transform: translate(92px, 27px); opacity: 0; }
        }
        @keyframes lbLegLeft {
            0%, 6% { transform: rotate(0deg); }
            14% { transform: rotate(-32deg); }
            22% { transform: rotate(22deg); }
            30% { transform: rotate(-32deg); }
            38% { transform: rotate(22deg); }
            46% { transform: rotate(-32deg); }
            54%, 100% { transform: rotate(8deg); }
        }
        @keyframes lbLegRight {
            0%, 6% { transform: rotate(0deg); }
            14% { transform: rotate(24deg); }
            22% { transform: rotate(-30deg); }
            30% { transform: rotate(24deg); }
            38% { transform: rotate(-30deg); }
            46% { transform: rotate(24deg); }
            54%, 100% { transform: rotate(-8deg); }
        }
        @keyframes lbArmLeft {
            0%, 6% { transform: rotate(15deg); }
            14% { transform: rotate(35deg); }
            22% { transform: rotate(-30deg); }
            30% { transform: rotate(35deg); }
            38% { transform: rotate(-30deg); }
            46% { transform: rotate(35deg); }
            54% { transform: rotate(-15deg); }
            62% { transform: rotate(-70deg); }
            70%, 92% { transform: rotate(162deg); }
            100% { transform: rotate(15deg); }
        }
        @keyframes lbArmRight {
            0%, 6% { transform: rotate(-15deg); }
            14% { transform: rotate(-35deg); }
            22% { transform: rotate(30deg); }
            30% { transform: rotate(-35deg); }
            38% { transform: rotate(30deg); }
            46% { transform: rotate(-35deg); }
            54% { transform: rotate(-45deg); }
            62% { transform: rotate(-95deg); }
            70%, 92% { transform: rotate(-162deg); }
            100% { transform: rotate(-15deg); }
        }
        @keyframes lbTrophyTake {
            0%, 56% { transform: translate(104px, 27px) scale(1); opacity: 1; }
            62% { transform: translate(101px, 24px) scale(1.05); opacity: 1; }
            70% { transform: translate(92px, 12px) scale(1.12); opacity: 1; }
            76% { transform: translate(92px, 9.5px) scale(1.16); opacity: 1; }
            82% { transform: translate(92px, 12px) scale(1.12); opacity: 1; }
            86% { transform: translate(92px, 10px) scale(1.16); opacity: 1; }
            92% { transform: translate(92px, 12px) scale(1.12); opacity: 1; }
            96% { transform: translate(92px, 12px) scale(0.85); opacity: 0; }
            98% { transform: translate(104px, 27px) scale(0.85); opacity: 0; }
            100% { transform: translate(104px, 27px) scale(1); opacity: 1; }
        }
        @keyframes lbSparklePop {
            0%, 66% { opacity: 0; transform: scale(0.3); }
            74%, 88% { opacity: 1; transform: scale(1.1); }
            95%, 100% { opacity: 0; transform: scale(0.3); }
        }
        .lb-boy-group { animation: lbBoyClimb 4.2s ease-in-out infinite; }
        .lb-leg-l { animation: lbLegLeft 4.2s ease-in-out infinite; }
        .lb-leg-r { animation: lbLegRight 4.2s ease-in-out infinite; }
        .lb-arm-l { animation: lbArmLeft 4.2s ease-in-out infinite; }
        .lb-arm-r { animation: lbArmRight 4.2s ease-in-out infinite; }
        .lb-trophy-group { animation: lbTrophyTake 4.2s ease-in-out infinite; }
        .lb-sparkles { animation: lbSparklePop 4.2s ease-in-out infinite; transform-origin: 92px 6px; }

        /* 3D Learn Board Login Rank Notification (Empty Background + Glowing Light + Animated Trophy + Gold 3D Number) */
        @keyframes rank3dPopIn {
            0% { opacity: 0; transform: scale(0.35) translateY(35px); }
            65% { opacity: 1; transform: scale(1.08) translateY(-6px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes rank3dPopOut {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.6) translateY(-20px); }
        }
        @keyframes rank3dGlowPulse {
            0%, 100% { opacity: 0.78; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.12); }
        }
        @keyframes rank3dRaysSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes rank3dTrophyFloat {
            0%, 100% { transform: translateZ(-36px) translateY(0px) rotateY(-18deg) rotateX(6deg) scale(1); }
            25% { transform: translateZ(-36px) translateY(-9px) rotateY(0deg) rotateX(-4deg) scale(1.04); }
            50% { transform: translateZ(-36px) translateY(-3px) rotateY(18deg) rotateX(5deg) scale(1.02); }
            75% { transform: translateZ(-36px) translateY(-10px) rotateY(0deg) rotateX(-5deg) scale(1.05); }
        }
        @keyframes rank3dNumFloat {
            0%, 100% { transform: translateZ(34px) translateY(10px) rotateY(-12deg) rotateX(5deg); }
            50% { transform: translateZ(34px) translateY(2px) rotateY(12deg) rotateX(-4deg); }
        }
        @keyframes rank3dNumCelebrate {
            0% { transform: scale(1); }
            40% { transform: scale(1.22); }
            70% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }
        @keyframes rank3dGlitter {
            0%, 100% { opacity: 0; transform: scale(0.2) rotate(0deg) translateY(0px); }
            35% { opacity: 1; transform: scale(1.15) rotate(90deg) translateY(-6px); }
            70% { opacity: 0.85; transform: scale(0.75) rotate(180deg) translateY(-12px); }
        }
        @keyframes rank3dShineSweep {
            0%, 100% { background-position: -180% 0; }
            50% { background-position: 180% 0; }
        }
        @keyframes rank3dCloseIn {
            0% { opacity: 0; transform: scale(0.4) rotate(-90deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        .rank3d-overlay {
            position: fixed;
            inset: 0;
            z-index: 120;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            pointer-events: none;
        }
        .rank3d-stage {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 900px;
            pointer-events: auto;
            animation: rank3dPopIn 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            user-select: none;
        }
        .rank3d-stage.closing {
            animation: rank3dPopOut 0.32s ease-in forwards;
        }
        .rank3d-light-aura {
            position: absolute;
            inset: -26px;
            border-radius: 9999px;
            background: radial-gradient(circle, rgba(255, 224, 102, 0.85) 0%, rgba(251, 191, 36, 0.45) 36%, rgba(249, 115, 22, 0.16) 58%, rgba(255, 215, 0, 0) 74%);
            filter: blur(12px);
            animation: rank3dGlowPulse 2.4s ease-in-out infinite;
            pointer-events: none;
        }
        .rank3d-light-rays {
            position: absolute;
            inset: -34px;
            border-radius: 9999px;
            background: repeating-conic-gradient(
                from 0deg,
                rgba(255, 240, 150, 0.34) 0deg 10deg,
                rgba(255, 240, 150, 0) 10deg 24deg
            );
            -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 0%, rgba(0,0,0,0.65) 42%, rgba(0,0,0,0) 70%);
            mask-image: radial-gradient(circle, rgba(0,0,0,1) 0%, rgba(0,0,0,0.65) 42%, rgba(0,0,0,0) 70%);
            animation: rank3dRaysSpin 16s linear infinite;
            pointer-events: none;
        }
        .rank3d-scene {
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
        }
        .rank3d-trophy-back {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            animation: rank3dTrophyFloat 4.4s ease-in-out infinite;
            filter: drop-shadow(0 0 18px rgba(250, 204, 21, 0.85)) drop-shadow(0 12px 16px rgba(180, 83, 9, 0.45));
            pointer-events: none;
        }
        .rank3d-number-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            animation: rank3dNumFloat 3.6s ease-in-out infinite;
            margin-top: 32px;
        }
        .rank3d-number-inner {
            position: relative;
            display: inline-block;
            transform-style: preserve-3d;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.03em;
            white-space: nowrap;
        }
        .rank3d-number-inner.celebrate {
            animation: rank3dNumCelebrate 0.55s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .rank3d-layer {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        .rank3d-front {
            position: relative;
            display: inline-block;
            background: linear-gradient(180deg, #fffde7 0%, #fef08a 18%, #facc15 44%, #d97706 72%, #fef08a 100%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 14px rgba(255, 224, 102, 0.95)) drop-shadow(0 4px 8px rgba(120, 53, 15, 0.65));
            animation: rank3dShineSweep 3s ease-in-out infinite;
        }
        .rank3d-glitter-dot {
            position: absolute;
            pointer-events: none;
            animation: rank3dGlitter var(--dur, 1.8s) ease-in-out var(--delay, 0s) infinite;
            filter: drop-shadow(0 0 6px rgba(255, 245, 157, 0.95));
        }
        .rank3d-close-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            z-index: 20;
            width: 34px;
            height: 34px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fef08a, #f59e0b);
            color: #78350f;
            border: 2px solid #fffbeb;
            box-shadow: 0 0 16px rgba(250, 204, 21, 0.95), 0 4px 10px rgba(0, 0, 0, 0.25);
            cursor: pointer;
            opacity: 0;
            animation: rank3dCloseIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) 0.7s forwards;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .rank3d-close-btn:hover {
            transform: scale(1.14) rotate(90deg);
            box-shadow: 0 0 22px rgba(255, 230, 100, 1), 0 6px 14px rgba(0, 0, 0, 0.3);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .sidebar-transition { transition: transform 0.3s ease-in-out; }
        .snap-x-mandatory { scroll-snap-type: x mandatory; }
        .snap-center { scroll-snap-align: center; }

        /* Custom Calendar Grid for Student View */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .calendar-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid #f1f5f9; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.2s;}
        .calendar-day.attended { background-color: #ecfdf5; border-color: #f59e0b; color: #ffa200; }
        .calendar-day.pending { background-color: #fffbeb; border-color: #f59e0b; color: #b45309; }
        .calendar-day.admin-interactive:hover { border-color: #f59e0b; background-color: #f0fdf4; }
        .calendar-mark { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background-color: #f59e0b; margin: 1px; }
        .calendar-mark-pending { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background-color: #f59e0b; margin: 1px; }
    </style>
</head>
<body class="antialiased text-slate-800 flex flex-col overflow-hidden">

    <div id="toast-container" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none w-full max-w-xs px-4 md:px-0 ml-auto"></div>

    <div id="app" class="flex-grow flex items-center justify-center p-4 w-full h-full relative">
        <div class="text-brand-600 font-bold flex flex-col items-center">
            <div class="loader mb-2 w-8 h-8 border-4"></div>
            Connecting to Academy Server...
        </div>
    </div>

    <div id="global-modals"></div>

    <script>
        // --- API & ROUTE CONFIGURATION ---
        const API_URL = 'https://script.google.com/macros/s/AKfycbwFFMkEm3KEeq21bZkuw6nbrJu0WEXeNzoNyEn1grdH3WsSXe-WlrB5jsUjUQW49eaHhA/exec';

        const ROUTES = {
            login: 'index.html',
            student: 'student.html',
            admin: 'admin.html',
            tieup: 'attendance.html'
        };

        function escapeHtml(str) {
            const amp = String.fromCharCode(38);
            return String(str || '')
                .replace(/&/g, amp + 'amp;')
                .replace(/</g, amp + 'lt;')
                .replace(/>/g, amp + 'gt;')
                .replace(/"/g, amp + 'quot;')
                .replace(/'/g, amp + '#39;');
        }

        function escapeJs(str) {
            return String(str || '')
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/"/g, '\\"')
                .replace(/\r?\n/g, ' ');
        }

        // --- BOOK SCOPE HELPER ---
        function parseBookScope(b) {
            const accessRaw = String(b.accessType || '').trim().toLowerCase();
            const targetRaw = String(b.targetType || 'All').trim().toLowerCase();

            let isViewAll = false;
            if (accessRaw === 'all') {
                isViewAll = true;
            } else if (accessRaw === 'paid') {
                isViewAll = false;
            } else if (targetRaw.startsWith('allstudents')) {
                isViewAll = true;
            } else {
                isViewAll = false;
            }

            let baseTarget = 'all';
            if (targetRaw === 'rank' || targetRaw.endsWith(':rank')) {
                baseTarget = 'rank';
            } else if (targetRaw === 'student' || targetRaw.endsWith(':student')) {
                baseTarget = 'student';
            }

            return { isViewAll, baseTarget };
        }

        // --- LEARN BOARD ELIGIBILITY & RANKING HELPERS ---
        function isStudentEligibleForLearnBoard(u) {
            if (!u) return false;
            const st = String(u.status || '').trim().toLowerCase();
            const rl = String(u.role || '').trim().toLowerCase();
            const lv = String(u.level || '').trim().toLowerCase();
            return rl !== 'admin' && st === 'approved' && lv !== '' && lv !== 'unranked' && lv !== 'initial' && lv !== 'tournament puzzles';
        }

        function computeStudentLearnBoardData(users, learnBoardRecords, currentUser) {
            const pointsMap = {};
            (learnBoardRecords || []).forEach(r => {
                if (r && r.username) {
                    pointsMap[String(r.username).trim().toLowerCase()] = Number(r.points) || 0;
                }
            });

            const eligibleStudents = (users || []).filter(isStudentEligibleForLearnBoard).map(u => {
                const key = String(u.username || '').trim().toLowerCase();
                return {
                    username: u.username,
                    branch: u.branch || '',
                    level: u.level || '',
                    points: pointsMap.hasOwnProperty(key) ? pointsMap[key] : 0
                };
            });

            const sortAndRank = (list) => {
                const sorted = list.slice().sort((a, b) => {
                    if (b.points !== a.points) return b.points - a.points;
                    return String(a.username).localeCompare(String(b.username));
                });
                let lastPts = null;
                let lastRank = 0;
                return sorted.map((item, idx) => {
                    const rank = (lastPts !== null && item.points === lastPts) ? lastRank : (idx + 1);
                    lastPts = item.points;
                    lastRank = rank;
                    return { ...item, rank };
                });
            };

            const overallList = sortAndRank(eligibleStudents);
            const currentKey = String((currentUser && currentUser.username) || '').trim().toLowerCase();
            const myOverallEntry = overallList.find(item => String(item.username).trim().toLowerCase() === currentKey) || null;

            const myBranch = String((currentUser && currentUser.branch) || '').trim();
            const branchEligible = myBranch
                ? eligibleStudents.filter(item => String(item.branch || '').trim().toLowerCase() === myBranch.toLowerCase())
                : [];
            const branchList = sortAndRank(branchEligible);
            const myBranchEntry = branchList.find(item => String(item.username).trim().toLowerCase() === currentKey) || null;

            return {
                myBranch: myBranch,
                myPoints: myOverallEntry ? myOverallEntry.points : 0,
                myOverallRank: myOverallEntry ? myOverallEntry.rank : null,
                totalOverallStudents: overallList.length,
                myBranchRank: myBranchEntry ? myBranchEntry.rank : null,
                totalBranchStudents: branchList.length,
                branchList: branchList
            };
        }

        function getLevelPrice(level) {
            if (!level || level === 'Unranked') return 200;
            if (level === 'Initial') return 0;
            if (level === 'Tournament Puzzles') return 500;
            if (level === 'Exam') return 200;
            if (level.includes('Advance Pro')) return 500;
            if (level.includes('Advance Level')) return 400;
            if (level.includes('Intermediate')) return 300;
            if (level.includes('Beginner')) return 200;
            return 200;
        }

        function getMaterialLinks(level) {
            const commonNotesLink = "https://drive.google.com/drive/folders/1iDA0-CcGfVwJNyWDtUpc0Qon2c-oGghO?usp=sharing";
            if (!level || level === 'Unranked') return { course: commonNotesLink, notes: commonNotesLink };
            if (level === 'Initial') return { course: commonNotesLink, notes: commonNotesLink };
            if (level.includes('Beginner')) return { course: "https://drive.google.com/drive/folders/1iRWADoVKAKNRhjjolGJ_GIhNXDbnaAyy?usp=sharing", notes: commonNotesLink };
            if (level.includes('Intermediate')) return { course: "https://drive.google.com/drive/folders/1CdEedjWBRkhV62aMVnt_rX_YD9riKGHt?usp=sharing", notes: commonNotesLink };
            if (level.includes('Advance')) return { course: "https://drive.google.com/drive/folders/1tVXXHNm4zB2JEPEvz_FXG6enijdFIFLy?usp=sharing", notes: commonNotesLink };
            if (level === 'Tournament Puzzles' || level === 'Exam') return { course: commonNotesLink, notes: commonNotesLink };
            return { course: commonNotesLink, notes: null };
        }

        let expireTimerInterval = null;
        let examTimerInterval = null;
        window.currentUser = null;
        window.cachedPuzzleBooks = [];
        window.cachedLearnBoardSummary = null;
        window.hasShownRankNotification = false;
        window.blindfoldBotTab = null;
        window.studentAttendanceRecords = [];
        window.studentCalendarDate = new Date();

        // --- DATA MANAGEMENT ---
        async function fetchUsers() { try { return await (await fetch(`${API_URL}?action=getUsers&t=${Date.now()}`)).json(); } catch (e) { return null; } }
        async function fetchTasks() { try { return await (await fetch(`${API_URL}?action=getTasks&t=${Date.now()}`)).json(); } catch (e) { return []; } }
        async function fetchExams() { try { return await (await fetch(`${API_URL}?action=getExams&t=${Date.now()}`)).json(); } catch (e) { return []; } }
        async function fetchSubmissions() { try { return await (await fetch(`${API_URL}?action=getSubmissions&t=${Date.now()}`)).json(); } catch (e) { return []; } }
        async function fetchSettings() { try { return await (await fetch(`${API_URL}?action=getSettings&t=${Date.now()}`)).json(); } catch (e) { return {}; } }
        async function fetchAttendance() { try { return await (await fetch(`${API_URL}?action=getAttendance&t=${Date.now()}`)).json(); } catch (e) { return []; } }
        async function fetchPuzzleBooks() { try { return await (await fetch(`${API_URL}?action=getPuzzleBooks&t=${Date.now()}`)).json(); } catch (e) { return []; } }
        async function fetchLearnBoard() { try { return await (await fetch(`${API_URL}?action=getLearnBoard&t=${Date.now()}`)).json(); } catch (e) { return []; } }

        async function updateUserStatusAPI(username, status) { return await sendPostRequest({ action: 'updateStatus', username: username, status: status }); }
        async function uploadFileAPI(data) { return await sendPostRequest(data); }
        async function logActivityAPI(username, action, details) { return await sendPostRequest({ action: 'logActivity', data: { username, action, details } }); }

        async function sendPostRequest(data) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(data)
                });
                const text = await response.text();
                try {
                    return JSON.parse(text);
                } catch (err) {
                    return { success: false, message: "Server response was invalid or timed out." };
                }
            } catch (error) {
                return { success: false, message: error.message };
            }
        }

            window.renderStudentAttendanceCalendar();
        };

        window.renderStudentAttendanceCalendar = function() {
            const bodyEl = document.getElementById('attendanceCalendarBody');
            if (!bodyEl) return;

            const records = window.studentAttendanceRecords || [];
            const viewDate = window.studentCalendarDate || new Date();
            const viewMonth = viewDate.getMonth();
            const viewYear = viewDate.getFullYear();

            const now = new Date();
            const isCurrentMonth = viewMonth === now.getMonth() && viewYear === now.getFullYear();

            const selectedMonthAttendance = records.filter(a => {
                const d = new Date(a.date);
                return !isNaN(d.getTime()) && d.getMonth() === viewMonth && d.getFullYear() === viewYear;
            });

            const selectedYearAttendance = records.filter(a => {
                const d = new Date(a.date);
                return !isNaN(d.getTime()) && d.getFullYear() === viewYear;
            });

            const firstDay = new Date(viewYear, viewMonth, 1).getDay();
            const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
            const monthName = viewDate.toLocaleString('default', { month: 'long', year: 'numeric' });

        window.copyTournamentPin = async function(pin, username) {
            if (!pin) return;
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(pin);
                } else {
                    const tempInput = document.createElement('textarea');
                    tempInput.value = pin;
                    tempInput.style.position = 'fixed';
                    tempInput.style.opacity = '0';
                    document.body.appendChild(tempInput);
                    tempInput.focus();
                    tempInput.select();
                    document.execCommand('copy');
                    document.body.removeChild(tempInput);

                showToast(`PIN Copied: ${pin}`, 'success');

        // --- WATERMARKING FUNCTION (FAST GET + NATIVE BUFFER) ---
        window.downloadBookById = function(bookId) {
            const book = (window.cachedPuzzleBooks || []).find(b => String(b.id) === String(bookId));
            if (!book || !window.currentUser) {
                showToast("Unable to find puzzle book.", "error");
                return;

                book.fileId,
                book.fileType,
                window.currentUser.username,

        window.downloadWithWatermark = async function(fileId, mimeType, studentName, studentPhone, title) {
            if (!fileId) {
                showToast("Invalid file link", "error");
                return;
            }

            showToast("Downloading and applying secure watermark... Please wait.", "info");
            logUserAction(studentName, 'Download Puzzle Book', title);

            try {
                const fetchUrl = `${API_URL}?action=downloadBookFile&fileId=${encodeURIComponent(fileId)}`;
                const response = await fetch(fetchUrl);
                const res = await response.json();

                if (!res || !res.success) throw new Error((res && res.message) || "Failed to download from server");

                const watermarkText = `${studentName} - ${studentPhone}`;
                const safeTitle = String(title || 'puzzle_book').replace(/[^a-z0-9]/gi, '_').toLowerCase();
                const actualMime = res.mimeType || mimeType || 'application/pdf';

                const dataUrl = `data:${actualMime};base64,${res.base64}`;
                const fileResponse = await fetch(dataUrl);
                const arrayBuffer = await fileResponse.arrayBuffer();

                if (actualMime === 'application/pdf' || actualMime.includes('pdf')) {
                    const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
                    const pages = pdfDoc.getPages();
                    const helveticaFont = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
                    const textSize = 14;
                    const textWidth = helveticaFont.widthOfTextAtSize(watermarkText, textSize);

                    for (const page of pages) {
                        const { width, height } = page.getSize();
                        page.drawText(watermarkText, {
                            x: width - textWidth - 20,
                            y: height - 30,
                            size: textSize,
                            font: helveticaFont,
                            color: PDFLib.rgb(0.8, 0.1, 0.1),
                            opacity: 0.7,
                        });
                    }

                    const pdfBytes = await pdfDoc.save();
                    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                    const blobUrl = URL.createObjectURL(blob);
                    const downloadLink = document.createElement('a');
                    downloadLink.href = blobUrl;
                    downloadLink.download = `${safeTitle}_${studentName}.pdf`;
                    downloadLink.click();
                    setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
                } else if (actualMime.startsWith('image/')) {
                    const blob = new Blob([arrayBuffer], { type: actualMime });
                    const imgUrl = URL.createObjectURL(blob);
                    const img = new Image();

                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);

                        ctx.font = "bold 24px Arial";
                        ctx.fillStyle = "rgba(200, 20, 20, 0.7)";
                        ctx.textAlign = "right";
                        ctx.fillText(watermarkText, canvas.width - 20, 40);

                        canvas.toBlob(canvasBlob => {
                            const outUrl = URL.createObjectURL(canvasBlob);
                            const downloadLink = document.createElement('a');
                            downloadLink.href = outUrl;
                            downloadLink.download = `${safeTitle}_${studentName}.png`;
                            downloadLink.click();
                            setTimeout(() => {
                                URL.revokeObjectURL(imgUrl);
                                URL.revokeObjectURL(outUrl);
                            }, 5000);
                        });
                    };
                    img.src = imgUrl;
                } else {
                    const blob = new Blob([arrayBuffer], { type: actualMime });
                    const blobUrl = URL.createObjectURL(blob);
                    const downloadLink = document.createElement('a');
                    downloadLink.href = blobUrl;
                    downloadLink.download = `${safeTitle}_download`;
                    downloadLink.click();
                    setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
                }

                showToast("Download Complete!", "success");
            } catch (err) {
                console.error(err);
                showToast("Error processing file: " + err.message, "error");
            }
        };

        // --- UI UTILITIES ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = {
                success: 'bg-emerald-600 text-white border-l-4 border-emerald-800',
                error: 'bg-red-500 text-white border-l-4 border-red-800',
                info: 'bg-brand-600 text-white border-l-4 border-brand-800'
            };
            const icons = {
                success: '<i class="fas fa-check-circle mr-2"></i>',
                error: '<i class="fas fa-exclamation-triangle mr-2"></i>',
                info: '<i class="fas fa-info-circle mr-2"></i>'
            };
            toast.className = `${colors[type]} px-4 py-3 md:px-6 md:py-4 rounded shadow-2xl transform transition-all duration-300 translate-x-full pointer-events-auto flex items-center font-medium text-sm md:text-base`;
            toast.innerHTML = `${icons[type]} <span>${message}</span>`;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-x-full'));
            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function startRealtimeTimer(expiryDateStr) {
            if (expireTimerInterval) clearInterval(expireTimerInterval);
            const timerEl = document.getElementById('expire-timer');
            if (!timerEl || !expiryDateStr) return;
            const target = new Date(expiryDateStr).getTime();
            if (isNaN(target)) return;

            const update = () => {
                const now = new Date().getTime();
                const diff = target - now;
                if (diff <= 0) {
                    timerEl.innerHTML = `<i class="fas fa-exclamation-circle"></i> Expired`;
                    timerEl.className = "px-2 py-0.5 rounded bg-red-100 text-red-600 text-[10px] md:text-xs font-bold border border-red-200 flex items-center gap-1";
                    clearInterval(expireTimerInterval);
                    return;
                }
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                timerEl.innerHTML = `<span class="mr-1 opacity-70">Expire Time Left:</span> <i class="fas fa-clock"></i> ${days > 0 ? days + 'd ' : ''}${hours}h ${minutes}m ${seconds}s`;
            };
            update();
            expireTimerInterval = setInterval(update, 1000);
        }

        function initExamTimers() {
            if (examTimerInterval) clearInterval(examTimerInterval);
            const examRows = document.querySelectorAll('.exam-row-logic');
            if (examRows.length === 0) return;

            const activeUsername = window.currentUser ? window.currentUser.username : '';

            const updateExams = () => {
                const now = new Date().getTime();
                examRows.forEach(row => {
                    const startStr = row.getAttribute('data-start');
                    const endStr = row.getAttribute('data-end');
                    const link = row.getAttribute('data-link');
                    const id = row.getAttribute('data-id');

                    const hasSubmitted = row.getAttribute('data-submitted') === 'true';
                    const status = row.getAttribute('data-status');
                    const remarks = row.getAttribute('data-remarks');

                    const timeDisplay = row.querySelector('.exam-time-display');
                    const actions = row.querySelector('.exam-actions');

                    if (!startStr || !endStr) return;
                    const start = new Date(startStr).getTime();
                    const end = new Date(endStr).getTime();

                    if (hasSubmitted) {
                        if (status === 'pending') {
                            timeDisplay.innerHTML = `<span class="text-amber-600 font-bold"><i class="fas fa-clock"></i> Under Review by Admin</span>`;
                            actions.innerHTML = `<span class="bg-slate-100 text-slate-500 px-4 py-2 rounded-lg text-xs font-bold">Pending Grade</span>`;
                        } else if (status === 'correct') {
                            timeDisplay.innerHTML = `<span class="text-emerald-600 font-bold"><i class="fas fa-check-circle"></i> Exam Passed!</span>`;
                            actions.innerHTML = `<div class="flex flex-col items-end"><span class="bg-emerald-100 text-emerald-700 px-4 py-2 rounded-lg text-xs font-bold">Passed</span>${remarks ? `<div class="mt-2 text-xs text-slate-500 italic max-w-xs text-right">Remark: ${remarks}</div>` : ''}</div>`;
                        } else if (status === 'incorrect') {

                            actions.innerHTML = `<div class="flex flex-col items-end"><span class="bg-red-100 text-red-700 px-4 py-2 rounded-lg text-xs font-bold">Failed</span>${remarks ? `<div class="mt-2 text-xs text-slate-500 italic max-w-xs text-right">Remark: ${remarks}</div>` : ''}</div>`;

                            actions.innerHTML = `<span class="bg-slate-100 text-slate-500 px-4 py-2 rounded-lg text-xs font-bold">Completed</span>`;
                        }
                        return;
                    }

                    if (now < start) {
                        timeDisplay.innerHTML = `<span class="text-amber-600 font-bold"><i class="fas fa-lock"></i> Starts: ${new Date(start).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'})}</span>`;

                    </div>

                    <div class="bg-white rounded-xl shadow-lg border border-brand-100 overflow-hidden mb-8">
                        <div class="bg-brand-500 p-4 flex justify-between items-center text-white">
                            <h3 class="font-bold text-lg flex items-center gap-2"><i class="fas fa-tasks"></i> ${taskLabel}</h3>
                            ${!isRestricted ? `<span class="text-xs bg-white/20 px-2 py-1 rounded">${myTasks.length} Assigned</span>` : ''}
                        </div>
                        <div class="p-0">
                            ${isRestricted
                                ? `
                                <div class="p-8 text-center flex flex-col items-center justify-center fade-in">
                                    <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-4 text-slate-400"><i class="fas fa-lock text-3xl"></i></div>
                                    <h3 class="text-xl font-bold text-slate-800 mb-2">${isExpired ? 'Weekly Plan Expired' : 'Weekly Tasks Locked'}</h3>
                                    <p class="text-slate-600 mb-6 max-w-md mx-auto text-sm md:text-base">${isExpired ? 'Your weekly task plan has expired. Please renew to continue learning.' : 'You have to pay to access the weekly task.'}</p>
                                    <div class="bg-orange-50 border border-orange-200 rounded-xl p-6 w-full max-w-xs shadow-sm">
                                        <p class="font-bold text-brand-600 text-2xl mb-1">Rs ${renewalPrice}</p>
                                        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-4">${isExpired ? 'Renewal Fee' : '3 Months Validity'}</p>
                                        <div class="bg-white py-2 px-3 rounded-lg border border-orange-100 flex items-center justify-center gap-2 text-slate-800 font-bold font-mono text-sm shadow-sm cursor-default select-all">
                                            <i class="fab fa-google-pay text-brand-500 text-lg"></i> 9444748538
                                        </div>
                                    </div>
                                    <p class="text-xs text-slate-400 mt-6">Please copy the number provided below and complete the payment.</p>
                                    <p class="text-xs text-slate-400 mt-6">Contact admin after payment to unlock.</p>
                                </div>
                                `
                                : (myTasks.length === 0
                                    ? `<div class="p-8 text-center text-slate-400 italic">No tasks assigned for ${user.level} yet.</div>`
                                    : `<div class="divide-y divide-slate-100">
                                    ${myTasks.map(t => {
                                        const isSolution = t.type === 'Solution';
                                        let isLocked = false;
                                        let releaseDateString = "";
                                        if (isSolution && t.releaseTime) {
                                            const nowTime = new Date();
                                            const release = new Date(t.releaseTime);
                                            if (nowTime < release) {
                                                isLocked = true;
                                                releaseDateString = release.toLocaleString([], { dateStyle: 'short', timeStyle: 'short' });
                                            }
                                        }
                                        const sub = submissions.find(s => s.taskId == t.id && s.username === user.username && s.uploadType !== 'Exam');
                                        let statusHtml = '';
                                        const remarksHtml = (sub && sub.remarks) ? `<div class="mt-2 text-xs text-slate-500 italic border-l-2 border-brand-200 pl-2 bg-slate-50 rounded-r py-1"><span class="font-bold not-italic text-brand-600">Admin Remarks:</span> ${sub.remarks}</div>` : '';

                                        if (isSolution) {
                                            if (isLocked) {
                                                statusHtml = `<div class="flex items-center gap-2 mt-2 md:mt-0"><div class="bg-slate-100 text-slate-500 px-4 py-2 rounded-lg text-xs font-bold cursor-not-allowed flex items-center gap-2 border border-slate-200"><i class="fas fa-lock"></i> Unlocks: ${releaseDateString}</div></div>`;
                                            } else {
                                                statusHtml = `<div class="flex items-center gap-2 mt-2 md:mt-0"><a href="${t.link}" target="_blank" onclick="logUserAction('${safeUsernameJs}', 'Watch Solution', 'Task ID: ${t.id}')" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-emerald-700 transition-all shadow-sm flex items-center gap-1"><i class="fas fa-play-circle"></i> Watch Solution</a></div>`;
                                            }
                                        } else {
                                            if (!sub) {
                                                statusHtml = `<div class="flex items-center gap-2 mt-2 md:mt-0"><a href="${t.link}" target="_blank" onclick="logUserAction('${safeUsernameJs}', 'View Task', 'Task ID: ${t.id}')" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-blue-700 transition-all shadow-sm flex items-center gap-1"><i class="fas fa-eye"></i> View Task</a><input type="file" id="file-${t.id}" accept="image/*,video/*,.pdf,.doc,.docx" class="hidden" onchange="handleFileSelect(event, '${t.id}', '${safeUsernameJs}', 'Task')"><button onclick="document.getElementById('file-${t.id}').click()" class="bg-secondary-900 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-black transition-all shadow-sm"><i class="fas fa-upload mr-1"></i> Upload Answer</button></div>`;
                                            } else if (sub.status === 'pending') {
                                                statusHtml = `<div class="flex flex-col items-end gap-1"><span class="bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full text-xs font-bold"><i class="fas fa-clock mr-1"></i> Under Review</span><a href="${t.link}" target="_blank" class="text-blue-600 hover:text-blue-800 underline text-[11px] font-bold transition-colors mt-1"><i class="fas fa-external-link-alt mr-1"></i> View Question</a></div>`;
                                            } else if (sub.status === 'correct') {
                                                statusHtml = `<div class="flex flex-col items-end"><span class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-xs font-bold"><i class="fas fa-check-circle mr-1"></i> Completed</span>${remarksHtml} <a href="${t.link}" target="_blank" class="text-blue-600 hover:text-blue-800 underline text-[11px] font-bold transition-colors mt-1"><i class="fas fa-external-link-alt mr-1"></i> View Question</a></div>`;
                                            } else if (sub.status === 'incorrect') {
                                                statusHtml = `<div class="flex flex-col items-end gap-1"><span class="bg-red-100 text-red-700 px-3 py-1 rounded-full text-xs font-bold"><i class="fas fa-times-circle mr-1"></i> Correction Needed</span>${remarksHtml}<div class="flex gap-2"><a href="${t.link}" target="_blank" onclick="logUserAction('${safeUsernameJs}', 'View Task Again', 'Task ID: ${t.id}')" class="text-blue-600 underline text-xs font-bold">View Task Again</a><button onclick="document.getElementById('file-${t.id}').click()" class="text-xs text-brand-600 underline font-bold">Re-upload</button></div><input type="file" id="file-${t.id}" accept="image/*,video/*,.pdf,.doc,.docx" class="hidden" onchange="handleFileSelect(event, '${t.id}', '${safeUsernameJs}', 'Task')"></div>`;
                                            }
                                        }
                                        return `<div class="p-4 flex flex-col md:flex-row md:items-center justify-between group transition-colors hover:bg-slate-50 gap-4"><div class="flex-grow"><div class="flex items-center gap-2">${isSolution ? '<span class="bg-emerald-100 text-emerald-700 text-[10px] px-2 py-0.5 rounded font-bold uppercase">Solution</span>' : '<span class="bg-blue-100 text-blue-700 text-[10px] px-2 py-0.5 rounded font-bold uppercase">Task</span>'}<div class="font-bold text-slate-800 text-sm md:text-base">${t.title}</div></div><div class="text-xs text-slate-400 mt-1 flex items-center gap-2"><i class="far fa-calendar"></i> ${t.date}</div><div id="progress-container-${t.id}" class="hidden mt-3 w-full max-w-xs"><div class="flex justify-between text-xs text-slate-500 mb-1"><span id="upload-text-${t.id}">Uploading...</span><span id="upload-percent-${t.id}">0%</span></div><div class="w-full bg-slate-200 rounded-full h-2"><div id="progress-bar-${t.id}" class="bg-brand-500 h-2 rounded-full transition-all duration-300" style="width: 0%"></div></div></div></div><div class="flex items-center gap-3">${statusHtml}</div></div>`;
                                    }).join('')}
                                   </div>`)
                            }
                        </div>
                    </div>

                    ${!isRestricted ? `
                    <div class="bg-white rounded-xl shadow-lg border border-brand-100 overflow-hidden mb-8 p-5 md:p-6 flex flex-col md:flex-row md:items-center justify-between gap-4 border-l-4 border-l-emerald-500">
                        <div>
                            <h3 class="font-bold text-lg flex items-center gap-2 text-slate-800 mb-1"><i class="fas fa-calendar-check text-emerald-500"></i> Monthly Attendance</h3>
                            <div class="flex flex-col gap-1 mt-2">
                                <p class="text-sm text-slate-500">Classes This Month: <span class="font-bold text-emerald-600 text-lg mx-1">${attendedClassesCount}</span> / 8</p>
                                <p class="text-sm text-slate-500">Classes Last Month: <span class="font-bold text-slate-600 text-md mx-1">${prevAttendedClassesCount}</span></p>
                                <p class="text-sm text-slate-500">Classes This Year (${currentYear}): <span class="font-bold text-slate-600 text-md mx-1">${thisYearClassesCount}</span></p>
                            </div>
                        </div>
                        <button onclick="openStudentAttendanceCalendar()" class="bg-emerald-50 text-emerald-600 font-bold py-2 px-5 rounded-lg text-sm hover:bg-emerald-100 transition-colors border border-emerald-200 shadow-sm flex items-center gap-2">
                            <i class="fas fa-calendar-alt"></i> View Calendar
                        </button>
                    </div>
                    ` : ''}

                    <div class="bg-gradient-to-r from-secondary-900 to-secondary-800 rounded-xl p-6 md:p-8 text-white relative overflow-hidden">
                        <div class="absolute top-0 right-0 p-4 opacity-10 text-8xl md:text-9xl"><i class="fas fa-chess-rook"></i></div>
                        <h4 class="font-bold text-lg md:text-xl mb-2 relative z-10">Academy Announcement</h4>
                        <p class="text-slate-300 text-sm md:text-base max-w-2xl relative z-10">Welcome to Chess Titans Academy. Check your ${taskLabel} above regularly.</p>
                    </div>
                </div>
            </div>
            `;
        }

        // --- BLINDFOLD AI BOT TAB CONTROLLER ---
        window.openBlindfoldBot = function(username) {
            const u = window.currentUser;
            const statusNorm = String((u && u.status) || '').trim().toLowerCase();
            const levelNorm = String((u && u.level) || '').trim().toLowerCase();
            if (!u || statusNorm === 'expired' || !levelNorm || levelNorm === 'unranked' || levelNorm === 'initial') {
                showToast('Only active paid students can play Blindfold AI Bot.', 'error');
                return;
            }
            logUserAction(username, 'Click Blindfold AI', 'Opened blindfold AI bot');
            if (window.blindfoldBotTab && !window.blindfoldBotTab.closed) {
                window.blindfoldBotTab.focus();
            } else {
                window.blindfoldBotTab = window.open('https://chesstitansacademy.vercel.app/chessbotai.html', '_blank');
            }
        };

        window.addEventListener('beforeunload', function () {
            if (window.blindfoldBotTab && !window.blindfoldBotTab.closed) {
                window.blindfoldBotTab.close();
            }
        });

        // --- FILE UPLOAD HANDLER ---
        window.handleFileSelect = async function(event, taskId, username, uploadType = 'Task') {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 20 * 1024 * 1024) {
                alert("FILE TOO BIG: " + (file.size / 1024 / 1024).toFixed(2) + "MB\n\nLimit is 20MB.");
                return;
            }

            const container = document.getElementById(`progress-container-${taskId}`);
            const progressBar = document.getElementById(`progress-bar-${taskId}`);
            const percentText = document.getElementById(`upload-percent-${taskId}`);
            const statusText = document.getElementById(`upload-text-${taskId}`);

            container.classList.remove('hidden');
            statusText.innerText = "Reading File...";

            const reader = new FileReader();

            reader.onerror = function() {
                alert("Error reading file from your computer.");
                container.classList.add('hidden');
            };

            reader.onload = async function(e) {
                try {
                    const base64Data = e.target.result.split(',')[1];
                    const mimeType = file.type;
                    const fileName = file.name;

                    statusText.innerText = "Sending to Chess Titans Academy Server...";
                    let progress = 0;
                    const interval = setInterval(() => {
                        if (progress >= 90) clearInterval(interval);
                        else {
                            progress += 1;
                            progressBar.style.width = `${progress}%`;
                            percentText.innerText = `${progress}%`;
                        }
                    }, 1000);

                    const response = await uploadFileAPI({
                        action: 'uploadEvidence',
                        taskId: taskId,
                        username: username,
                        fileData: base64Data,
                        mimeType: mimeType,
                        fileName: fileName,
                        uploadType: uploadType
                    });

                    clearInterval(interval);

                    if (response && response.success) {
                        progressBar.style.width = `100%`;
                        percentText.innerText = `100%`;
                        statusText.innerText = "Done!";
                        showToast(`${uploadType} Uploaded Successfully!`, "success");

                        setTimeout(() => {
                            loadStudentPortal(false);
                        }, 1000);
                    } else {
                        const errorMsg = response ? response.message : "Unknown Server Error";
                        alert("UPLOAD FAILED:\n" + errorMsg);
                        statusText.innerText = "Failed";
                        progressBar.classList.add('bg-red-500');
                    }
                } catch (error) {
                    alert("NETWORK ERROR:\n" + error.message);
                    container.classList.add('hidden');
                }
            };

            reader.readAsDataURL(file);
        };

        // --- GLOBAL HANDLERS ---
        window.logUserAction = function(username, action, details) {
            logActivityAPI(username, action, details).catch(console.error);
        };

        window.handleLogout = function() {
            if (expireTimerInterval) clearInterval(expireTimerInterval);
            if (examTimerInterval) clearInterval(examTimerInterval);
            if (window.blindfoldBotTab && !window.blindfoldBotTab.closed) {
                window.blindfoldBotTab.close();
            }
            window.closeLearnBoardRankNotification();
            window.hasShownRankNotification = false;
            window.currentUser = null;
            sessionStorage.removeItem('cta_session_user');
            showToast('Logged out', 'info');
            setTimeout(() => {
                window.location.href = ROUTES.login;
            }, 300);
        };

        // --- INITIALIZATION & SESSION GUARD ---
        async function loadStudentPortal(showLoader = true) {
            const rawSession = sessionStorage.getItem('cta_session_user');
            if (!rawSession) {
                window.location.href = ROUTES.login;
                return;
            }

            let sessionUser;
            try {
                sessionUser = JSON.parse(rawSession);
            } catch (e) {
                sessionStorage.removeItem('cta_session_user');
                window.location.href = ROUTES.login;
                return;
            }

            if (sessionUser.role === 'admin') {
                window.location.href = ROUTES.admin;
                return;
            }
            if (sessionUser.status === 'tieup') {
                window.location.href = ROUTES.tieup;
                return;
            }

            const app = document.getElementById('app');
            if (showLoader) {
                app.innerHTML = `
                    <div class="text-brand-600 font-bold flex flex-col items-center">
                        <div class="loader mb-2 w-8 h-8 border-4"></div>
                        Connecting to Academy Server...
                    </div>
                `;
            }

            try {
                const [users, tasks, submissions, settings, exams, attendance, puzzleBooks, learnBoard] = await Promise.all([
                    fetchUsers(),
                    fetchTasks(),
                    fetchSubmissions(),
                    fetchSettings(),
                    fetchExams(),
                    fetchAttendance(),
                    fetchPuzzleBooks(),
                    fetchLearnBoard()
                ]);

                if (!Array.isArray(users)) {
                    app.innerHTML = `
                        <div class="glass-panel rounded-xl p-8 text-center max-w-md mx-auto">
                            <i class="fas fa-wifi text-3xl text-red-500 mb-3"></i>
                            <h2 class="font-bold text-lg text-slate-800 mb-2">Connection Error</h2>
                            <p class="text-slate-500 text-sm mb-4">Unable to reach Academy Server. Please check your connection and try again.</p>
                            <button onclick="loadStudentPortal(true)" class="bg-brand-600 hover:bg-brand-700 text-white font-bold px-5 py-2.5 rounded-lg text-sm transition-colors">Retry</button>
                        </div>
                    `;
                    return;
                }

                const freshUser = users.find(u => String(u.username).toLowerCase() === String(sessionUser.username).toLowerCase());
                if (!freshUser) {
                    sessionStorage.removeItem('cta_session_user');
                    window.location.href = ROUTES.login;
                    return;
                }

                // Live expiration sync
                const now = new Date();
                if (freshUser.expireDate) {
                    const expireTime = new Date(freshUser.expireDate);
                    if (!isNaN(expireTime.getTime()) && now.getTime() > expireTime.getTime() && freshUser.status === 'approved') {
                        updateUserStatusAPI(freshUser.username, 'expired').catch(console.error);
                        freshUser.status = 'expired';
                    }
                }

                if (['blocked', 'pending', 'rejected'].includes(freshUser.status)) {
                    sessionStorage.removeItem('cta_session_user');
                    window.location.href = ROUTES.login;
                    return;
                }

                window.currentUser = freshUser;
                sessionStorage.setItem('cta_session_user', JSON.stringify(freshUser));

                if (expireTimerInterval) clearInterval(expireTimerInterval);
                if (examTimerInterval) clearInterval(examTimerInterval);

                app.innerHTML = renderUserHome({
                    user: freshUser,
                    users: users || [],
                    tasks: tasks || [],
                    submissions: submissions || [],
                    settings: settings || {},
                    exams: exams || [],
                    attendance: attendance || [],
                    puzzleBooks: puzzleBooks || [],
                    learnBoard: Array.isArray(learnBoard) ? learnBoard : []
                });

                window.renderStudentAttendanceCalendar();

                if (freshUser.expireDate && freshUser.status !== 'expired') {
                    startRealtimeTimer(freshUser.expireDate);
                }
                initExamTimers();

                const activeExamsForUser = (exams || []).filter(e => e.level === freshUser.level);
                const isExamModeActive = freshUser.level === 'Exam' || activeExamsForUser.length > 0;
                if (!window.hasShownRankNotification && !isExamModeActive && isStudentEligibleForLearnBoard(freshUser) && window.cachedLearnBoardSummary) {
                    window.hasShownRankNotification = true;
                    window.showLearnBoardRankNotification();
                }
            } catch (err) {
                console.error('loadStudentPortal error:', err);
                showToast('Failed to load student portal', 'error');
            }
        }

        // Start Student Portal
        loadStudentPortal(true);
    </script>
</body>
</html>
