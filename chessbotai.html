<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blindfold Chess - Chess Titans</title>
    <link rel="icon" href="images/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Chess logic and UI dependencies -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'], },
                    colors: {
                        brand: { 50: '#fff7ed', 100: '#ffedd5', 500: '#f97316', 600: '#ea580c', 900: '#7c2d12', },
                    }
                }
            }
        }
    </script>
    <style>
        /* Responsive body layout */
        body { 
            background-color: #fff7ed; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow-x: hidden; 
            overflow-y: auto;
            position: relative;
        }
        .glass-panel { 
            background: rgba(255, 255, 255, 0.95); 
            box-shadow: 0 20px 25px -5px rgba(234, 88, 12, 0.1); 
            z-index: 10;
        }
        .pulse-ring { animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        
        @keyframes pulse { 
            0% { box-shadow: 0 0 0 0 rgba(234, 88, 12, 0.7); } 
            70% { box-shadow: 0 0 0 20px rgba(234, 88, 12, 0); } 
            100% { box-shadow: 0 0 0 0 rgba(234, 88, 12, 0); } 
        }
        .board-hidden #myBoard { filter: blur(15px) grayscale(50%); pointer-events: none; transition: filter 0.5s ease; }
        
        /* Intro Animation CSS */
        #intro-overlay {
            position: fixed; inset: 0; z-index: 9999; background: #fff7ed;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1s ease, transform 1s ease;
        }
        .slide-up-fade { opacity: 0; transform: translateY(-20px); animation: fadeInUp 1.2s forwards 0.5s; }
        .slide-up-delayed { opacity: 0; transform: translateY(-20px); animation: fadeInUp 1.2s forwards 2.5s; }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        /* Child-Friendly Background Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(15deg); }
        }
        .float-1 { animation: float 6s ease-in-out infinite; }
        .float-2 { animation: float 8s ease-in-out infinite reverse; }
        .float-3 { animation: float 7s ease-in-out infinite 1s; }
        .float-4 { animation: float 9s ease-in-out infinite 2s; }

        /* Button Hover Bounces */
        button { transition: all 0.3s ease; }
        button:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        button:active { transform: translateY(1px); }

        /* Rolling Link Animation */
        .roll-link {
            display: inline-block;
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .roll-link:hover {
            transform: rotate(360deg) scale(1.15);
            color: #ea580c;
        }
    </style>
</head>
<body class="antialiased text-slate-800 relative">

    <!-- Royal Background Music Audio Tag -->
    <audio id="royalMusic" loop preload="auto">
        <!-- <source src="https://cdn.pixabay.com/audio/2022/01/18/audio_d0a13f69d2.mp3" type="audio/mpeg"> -->
    </audio>

    <!-- Animated Floating Background Pieces for Children -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden opacity-10">
        <i class="fas fa-chess-knight absolute text-8xl text-brand-500 float-1" style="top: 15%; left: 10%;"></i>
        <i class="fas fa-chess-queen absolute text-9xl text-brand-600 float-2" style="bottom: 20%; right: 10%;"></i>
        <i class="fas fa-chess-rook absolute text-7xl text-slate-400 float-3" style="top: 20%; right: 15%;"></i>
        <i class="fas fa-chess-pawn absolute text-8xl text-brand-400 float-4" style="bottom: 15%; left: 15%;"></i>
    </div>

    <!-- WELCOME ANIMATION OVERLAY -->
    <div id="intro-overlay">
        <div class="w-24 h-24 bg-brand-500 text-white rounded-2xl flex items-center justify-center text-5xl shadow-2xl mb-6 slide-up-fade" style="animation-delay: 0.2s;">
            <i class="fas fa-chess-knight"></i>
        </div>
        <h1 class="text-3xl md:text-5xl font-bold text-slate-800 text-center slide-up-fade" style="animation-delay: 0.5s;">Chess Titans Academy</h1>
        <p class="text-brand-600 font-bold mt-3 tracking-widest uppercase slide-up-fade" style="animation-delay: 1.5s;">Blindfold AI Experience</p>
        
        <!-- Button to bypass browser audio restrictions -->
        <button id="btnEnterAcademy" class="mt-8 px-8 py-3 bg-slate-800 text-white font-bold rounded-full pulse-ring slide-up-delayed hover:bg-black">
            Tap to Enter Academy <i class="fas fa-arrow-right ml-2"></i>
        </button>
    </div>

    <div class="flex-grow flex flex-col items-center justify-center p-4 z-10 w-full">
        <!-- Main Application Panel -->
        <div class="glass-panel w-full max-w-4xl rounded-2xl overflow-hidden flex flex-col md:flex-row shadow-2xl border border-brand-100 mt-4 md:mt-0">
            
            <!-- LEFT PANEL -->
            <div class="w-full md:w-1/2 p-6 md:p-8 bg-white flex flex-col z-10">
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-12 h-12 rounded-xl bg-brand-500 text-white flex items-center justify-center text-2xl shadow-lg"><i class="fas fa-brain"></i></div>
                    <div>
                        <h2 class="text-2xl font-bold text-slate-800">Blindfold Bot</h2>
                        <p class="text-sm text-slate-500">Train your visualization memory</p>
                    </div>
                </div>

                <!-- Setup Screen -->
                <div id="setup-screen" class="space-y-5">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Select Color</label>
                        <div class="flex gap-4">
                            <button id="btnWhite" onclick="selectColor('w')" class="flex-1 py-3 border-2 border-brand-500 bg-brand-50 text-brand-700 font-bold rounded-xl transition-all shadow-sm">White</button>
                            <button id="btnBlack" onclick="selectColor('b')" class="flex-1 py-3 border-2 border-slate-200 text-slate-500 font-bold rounded-xl hover:border-slate-300 transition-all">Black</button>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Bot Level (Toughness)</label>
                        <select id="botLevel" class="w-full border-2 border-slate-200 rounded-xl p-3 text-slate-700 font-bold outline-none focus:border-brand-500 transition-all cursor-pointer">
                            <option value="1">Level 1 (Beginner)</option>
                            <option value="3" selected>Level 2 (Intermediate)</option>
                            <option value="8">Level 3 (Advanced)</option>
                            <option value="15">Level 4 (Master)</option>
                        </select>
                    </div>

                    <button onclick="startGame()" class="w-full bg-gradient-to-r from-brand-600 to-brand-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg mt-4 text-lg hover:from-brand-700 hover:to-brand-600">
                        <i class="fas fa-play mr-2"></i> Start Match
                    </button>
                </div>

                <!-- Active Game Screen -->
                <div id="active-screen" class="hidden flex-col h-full space-y-6">
                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 text-center">
                        <h3 class="text-xs font-bold text-slate-500 uppercase mb-1">Status</h3>
                        <div id="gameStatus" class="text-lg font-bold text-brand-600">Your Turn</div>
                        <div id="lastMove" class="text-sm text-slate-600 mt-2 italic">Awaiting move...</div>
                    </div>

                    <div class="flex-grow flex flex-col items-center justify-center py-2">
                        <!-- Mic Button -->
                        <button id="btnMic" onclick="toggleMic()" class="w-20 h-20 rounded-full bg-brand-500 text-white text-3xl shadow-xl hover:bg-brand-600 transition-all flex items-center justify-center mb-3">
                            <i class="fas fa-microphone"></i>
                        </button>
                        
                        <!-- Text Backup -->
                        <div class="w-full max-w-xs mt-4">
                            <p class="text-xs text-slate-400 font-bold uppercase text-center mb-2">Or type move manually</p>
                            <div class="flex gap-2">
                                <input type="text" id="textInput" placeholder="e.g. e4, Nf3, O-O" autocomplete="off" class="w-full border-2 border-slate-200 rounded-lg px-3 py-2 outline-none focus:border-brand-500 text-sm font-bold text-slate-700">
                                <button onclick="submitText()" class="bg-slate-800 text-white px-4 py-2 rounded-lg font-bold hover:bg-black transition-all">GO</button>
                            </div>
                        </div>
                    </div>

                    <button onclick="endGame()" class="w-full bg-slate-200 text-slate-600 font-bold py-3 rounded-xl hover:bg-slate-300 transition-all">
                        Resign / End Game
                    </button>
                </div>
            </div>

            <!-- RIGHT PANEL: The Board -->
            <div class="w-full md:w-1/2 bg-slate-100 p-6 md:p-8 flex items-center justify-center relative board-hidden min-h-[350px]" id="boardWrapper">
                <div id="blindfoldOverlay" class="absolute inset-0 z-10 flex flex-col items-center justify-center bg-slate-900/10 rounded-b-2xl md:rounded-r-2xl md:rounded-bl-none">
                    <div class="bg-white p-6 rounded-2xl shadow-2xl text-center max-w-xs border border-slate-100">
                        <i class="fas fa-eye-slash text-4xl text-brand-500 mb-3 float-1"></i>
                        <h3 class="font-bold text-slate-800 text-lg">Blindfold Active</h3>
                        <p class="text-xs text-slate-500 mb-4 mt-1">Visualize the board in your mind.</p>
                        <button onclick="toggleBoard()" class="bg-slate-800 hover:bg-black text-white px-5 py-2 rounded-lg text-sm font-bold transition-all shadow-md">
                            <i class="fas fa-eye mr-1"></i> Reveal Board
                        </button>
                    </div>
                </div>
                <div id="myBoard" class="w-full max-w-[400px] transition-all duration-500 shadow-xl rounded-sm"></div>
            </div>
            
        </div>
        
        <!-- FOOTER WITH ROLLING LINK -->
        <div class="mt-8 text-center text-slate-500 text-sm font-medium z-10 pb-4">
            This website and AI bot is developed by <br class="block md:hidden"/>
            <a href="https://mjsteveportfolio.vercel.app/" target="_blank" class="font-bold text-slate-800 underline decoration-2 decoration-brand-500 roll-link ml-1">
                Steve rogers
            </a>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        // --- Intro & Audio Sequence ---
        // Requires user interaction to play music due to browser autoplay policies
        document.getElementById('btnEnterAcademy').addEventListener('click', () => {
            // Play Royal Background Music
            const music = document.getElementById('royalMusic');
            music.volume = 0.2; // Soft background volume
            music.play().catch(e => console.log("Audio autoplay blocked", e));

            // Speak Welcome with Royal Voice
            speak("Welcome to Chess Titans Academy. I am Rexlin, your AI Chess tutor. You are now experiencing the Blindfold Bot A.I.");

            // Fade Out Overlay
            const overlay = document.getElementById('intro-overlay');
            overlay.style.opacity = '0';
            overlay.style.transform = 'scale(1.05)';
            setTimeout(() => { overlay.style.display = 'none'; }, 1000);
        });

        // --- Responsive Board Fix ---
        window.addEventListener('resize', () => {
            if (board) {
                board.resize(); // Fixes board size issue on mobile/tab rotation
            }
        });

        // --- Chess Variables ---
        let board = null;
        let game = new Chess();
        let playerColor = 'w';
        let botDepth = 5;
        let isBlindfold = true;
        let speechRec = null;

        // Initialize Speech API
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            speechRec = new SpeechRecognition();
            speechRec.continuous = false;
            speechRec.lang = 'en-US';
            speechRec.interimResults = false;

            speechRec.onstart = function() {
                document.getElementById('btnMic').classList.add('pulse-ring');
                updateStatus("Listening...", "user");
                
                // AUTO-HIDE BOARD: If they peeked, instantly blur it out when they click the mic
                if (!isBlindfold) {
                    toggleBoard(); 
                }
            };

            speechRec.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                processMove(transcript);
            };

            speechRec.onerror = function(event) {
                document.getElementById('btnMic').classList.remove('pulse-ring');
                if (event.error === 'not-allowed') updateStatus("Mic blocked! Please allow access.", "error");
                else if (event.error === 'network') updateStatus("Network Error. Try typing below.", "error");
                else updateStatus("Error hearing move. Try typing below.", "error");
            };

            speechRec.onend = function() {
                document.getElementById('btnMic').classList.remove('pulse-ring');
            };
        }

        // --- Setup UI Interactions ---
        function selectColor(color) {
            playerColor = color;
            document.getElementById('btnWhite').className = color === 'w' ? "flex-1 py-3 border-2 border-brand-500 bg-brand-50 text-brand-700 font-bold rounded-xl transition-all shadow-sm" : "flex-1 py-3 border-2 border-slate-200 text-slate-500 font-bold rounded-xl hover:border-slate-300 transition-all";
            document.getElementById('btnBlack').className = color === 'b' ? "flex-1 py-3 border-2 border-brand-500 bg-brand-50 text-brand-700 font-bold rounded-xl transition-all shadow-sm" : "flex-1 py-3 border-2 border-slate-200 text-slate-500 font-bold rounded-xl hover:border-slate-300 transition-all";
        }

        function toggleBoard() {
            isBlindfold = !isBlindfold;
            document.getElementById('boardWrapper').className = isBlindfold ? "w-full md:w-1/2 bg-slate-100 p-6 md:p-8 flex items-center justify-center relative board-hidden min-h-[350px]" : "w-full md:w-1/2 bg-slate-100 p-6 md:p-8 flex items-center justify-center relative min-h-[350px]";
            document.getElementById('blindfoldOverlay').style.display = isBlindfold ? 'flex' : 'none';
        }

        function startGame() {
            botDepth = parseInt(document.getElementById('botLevel').value);
            game.reset();
            board = Chessboard('myBoard', { pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png', position: 'start', orientation: playerColor === 'w' ? 'white' : 'black' });
            
            // Re-trigger resize to ensure it conforms to current container width
            setTimeout(() => { board.resize(); }, 100);

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('active-screen').classList.remove('hidden');
            document.getElementById('active-screen').classList.add('flex');
            
            isBlindfold = true;
            document.getElementById('boardWrapper').classList.add('board-hidden');
            document.getElementById('blindfoldOverlay').style.display = 'flex';

            speak("Game started. Good luck!");
            if (playerColor === 'b') { 
                updateStatus("Computer is thinking...", "bot"); 
                setTimeout(makeBotMove, 1000); 
            } else { 
                updateStatus("Your Turn (Tap Mic or Type)", "user"); 
            }
        }

        function endGame() {
            speak("Game ended. Well played!");
            document.getElementById('active-screen').classList.add('hidden');
            document.getElementById('active-screen').classList.remove('flex');
            document.getElementById('setup-screen').classList.remove('hidden');
        }

        function toggleMic() {
            if (game.turn() === playerColor) {
                if(speechRec) speechRec.start();
                else alert("Voice not supported by your browser. Please type your move.");
            } else alert("It's not your turn!");
        }

        // AUTO-HIDE BOARD: If they peeked, instantly blur it out when they start typing
        document.getElementById('textInput').addEventListener('focus', function() {
            if (!isBlindfold) toggleBoard();
        });

        function submitText() {
            const val = document.getElementById('textInput').value;
            if(val.trim() !== "") {
                if (!isBlindfold) toggleBoard(); // Hide board if they forgot to
                processMove(val);
                document.getElementById('textInput').value = "";
            }
        }

        // --- Move Parser Logic ---
        function processMove(rawText) {
            document.getElementById('lastMove').innerText = `Heard: "${rawText}"`;

            let text = rawText.toLowerCase();

            text = text.replace(/\bfour\b/g, '4').replace(/\bfor\b/g, '4');
            text = text.replace(/\btoo\b/g, '2').replace(/\btwo\b/g, '2');
            text = text.replace(/\bone\b/g, '1').replace(/\bthree\b/g, '3').replace(/\bfive\b/g, '5').replace(/\bsix\b/g, '6').replace(/\bseven\b/g, '7').replace(/\beight\b/g, '8');

            text = text.replace(/\bsee\b/g, 'c').replace(/\bbe\b/g, 'b').replace(/\bhey\b/g, 'a').replace(/\bdee\b/g, 'd');

            text = text.replace(/\btakes\b/g, 'x').replace(/\btake\b/g, 'x');
            text = text.replace(/\bcaptures\b/g, 'x').replace(/\bcapture\b/g, 'x');
            text = text.replace(/\bkills\b/g, 'x').replace(/\bkill\b/g, 'x');

            text = text.replace(/\bknight\b/g, 'N').replace(/\bnight\b/g, 'N');
            text = text.replace(/\bbishop\b/g, 'B').replace(/\brook\b/g, 'R').replace(/\bqueen\b/g, 'Q').replace(/\bking\b/g, 'K');
            
            text = text.replace(/castles short/g, 'O-O').replace(/castle short/g, 'O-O');
            text = text.replace(/castles long/g, 'O-O-O').replace(/castle long/g, 'O-O-O');
            text = text.replace(/castles/g, 'O-O').replace(/castle/g, 'O-O'); 

            let strictText = text.replace(/[^a-zA-Z0-9\-xO\=]/g, '').trim();

            if (['n','b','r','q','k'].includes(strictText.charAt(0))) {
                strictText = strictText.charAt(0).toUpperCase() + strictText.slice(1);
            }

            let move = game.move(strictText);
            
            if (!move) move = game.move(strictText, { sloppy: true }); 
            
            if (!move && strictText.includes('x')) {
               move = game.move(strictText.replace(/^[a-h]x/i, 'x'), { sloppy: true });
            }

            if (move) {
                board.position(game.fen());
                speak(`You played ${move.san}`);
                document.getElementById('lastMove').innerText = `Parsed: ${move.san}`;
                
                if (game.in_checkmate()) { 
                    speak("Checkmate! You win!"); 
                    updateStatus("You Won!", "success"); 
                    return; 
                } else if (game.in_draw()) {
                    speak("Game Drawn!");
                    updateStatus("Draw", "bot");
                    return;
                }
                
                updateStatus("Computer is thinking...", "bot");
                setTimeout(makeBotMove, 1800);
            } else {
                speak("Invalid move. Try again.");
                updateStatus(`Invalid move: ${strictText}`, "error");
            }
        }

        // --- BOT AI ENGINE ---
        async function makeBotMove() {
            updateStatus("Computer is thinking...", "bot");
            
            try {
                let botMoveStr = null;

                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 4000); 
                    
                    const fallbackUrl = `https://stockfish.online/api/s/v2.php?fen=${encodeURIComponent(game.fen())}&depth=${botDepth}`;
                    const response = await fetch(fallbackUrl, { signal: controller.signal });
                    clearTimeout(timeoutId);
                    
                    const data = await response.json();
                    if (data && data.success && data.data) {
                        botMoveStr = data.data.split(" ")[1]; 
                    }
                } catch (err1) {
                    console.warn("Stockfish API failed or timed out.", err1);
                }

                let moveResult = null;

                if (botMoveStr) {
                    botMoveStr = botMoveStr.trim();
                    if (/^[a-h][1-8][a-h][1-8][qrbn]?$/.test(botMoveStr)) {
                        moveResult = game.move({
                            from: botMoveStr.substring(0, 2),
                            to: botMoveStr.substring(2, 4),
                            promotion: botMoveStr.length === 5 ? botMoveStr[4] : 'q'
                        });
                    } else {
                        moveResult = game.move(botMoveStr, { sloppy: true });
                    }
                }

                if (!moveResult) {
                    console.warn("API failed. Activating local Random Mover.");
                    const possibleMoves = game.moves();
                    if (possibleMoves.length > 0) {
                        const randomIdx = Math.floor(Math.random() * possibleMoves.length);
                        moveResult = game.move(possibleMoves[randomIdx]);
                    }
                }

                if (moveResult) {
                    board.position(game.fen());
                    speak(`Computer plays ${moveResult.san}`);
                    document.getElementById('lastMove').innerText = `Computer played: ${moveResult.san}`;

                    if (game.in_checkmate()) { 
                        speak("Checkmate! Computer wins."); 
                        updateStatus("Computer Won", "error"); 
                    } else if (game.in_draw()) {
                        speak("Game Drawn.");
                        updateStatus("Draw", "bot");
                    } else {
                        updateStatus("Your Turn (Tap Mic or Type)", "user");
                    }
                } else {
                    throw new Error("Could not generate a valid move.");
                }

            } catch (error) { 
                updateStatus("Bot AI Error. Please Refresh.", "error"); 
                console.error("Bot AI Error:", error);
            }
        }

        // Status & TTS Control
        function updateStatus(text, type) {
            const el = document.getElementById('gameStatus');
            el.innerText = text;
            if (type === 'user') el.className = "text-lg font-bold text-brand-600";
            else if (type === 'bot') el.className = "text-lg font-bold text-slate-500";
            else if (type === 'error') el.className = "text-lg font-bold text-red-500";
            else if (type === 'success') el.className = "text-lg font-bold text-green-500";
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                
                // Fetch voices and try to select a British/Royal voice
                const voices = window.speechSynthesis.getVoices();
                let royalVoice = voices.find(v => v.lang === 'en-GB' || v.name.includes('UK') || v.name.includes('Great Britain'));
                
                const utterance = new SpeechSynthesisUtterance(text);
                
                if (royalVoice) {
                    utterance.voice = royalVoice;
                }
                
                utterance.rate = 0.85; // Slightly slower
                utterance.pitch = 0.7; // Deeper, more majestic tone
                
                window.speechSynthesis.speak(utterance);
            }
        }

        // Ensure voices are loaded for the royal voice selection
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
        }
        
        document.getElementById("textInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                submitText();
            }
        });
    </script>
</body>
</html>
